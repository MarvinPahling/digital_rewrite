# Icon and brand manifest. Paths are relative to this file's directory (reimplementation/assets).
# src = editable VectorCraft source; svg = delivery SVG that build.rs rasterizes.
# PNGs are build outputs generated from the svg files and are never committed.
# replaces = name of the Digital toolbar/menu resource this icon stands in for (name only, no art used).

[[icon]]
id = "file-new"
group = "file"
src = "icons/src/file-new.svg"
svg = "icons/svg/file-new.svg"
replaces = "document-new"
meaning = "Create a new circuit document"
kind = "monochrome"
colors = ["#000000"]

